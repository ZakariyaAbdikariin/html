<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Registration Form</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #000000, #434343, #000000);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: white;
      }

      form {
        background: rgba(0, 0, 0, 0.85);
        padding: 30px;
        border-radius: 12px;
        max-width: 700px;
        width: 100%;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #00ffff;
      }

      fieldset {
        border: 2px solid #00ffff;
        border-radius: 10px;
        margin-bottom: 20px;
        padding: 20px;
      }

      legend {
        font-weight: bold;
        padding: 0 10px;
        color: #00ffff;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        background: #111;
        color: #fff;
        border: 1px solid #555;
      }

      .submit-btn {
        width: 100%;
        padding: 15px;
        margin-top: 10px;
        background: #00ffff;
        color: black;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <form action="https://microsoft.com" method="post">
      <h1>Advance Soldier Registration</h1>

      <fieldset>
        <legend>Basic Info</legend>

        <label>Full Name:</label>
        <input type="text" value="Sakariye Abdikariin" />

        <label>Password</label>
        <input type="password" value="Password123" />

        <label>Email</label>
        <input type="email" value="john.doe@army.mil" />

        <label>Phone</label>
        <input type="tel" value="+1 555 123 4567" />

        <label>Website</label>
        <input type="url" value="https://army.example.com" />

        <label>Number</label>
        <input type="number" value="25" min="0" max="100" />

        <label>Range</label>
        <input type="range" value="70" min="0" max="100" />

        <label>Date</label>
        <input type="date" id="date" name="date" value="2024-06-01" />

        <label>Time</label>
        <input type="time" value="09:30" />

        <label>Favorite Color</label>
        <input type="color" value="#00ffff" />
      </fieldset>

      <fieldset>
        <legend>Radio Buttons</legend>

        <label> <input type="radio" name="gender" checked /> Male </label>
        <label> <input type="radio" name="gender" /> Female </label>
        <label> <input type="radio" name="gender" /> Other </label>
      </fieldset>

      <fieldset>
        <legend>Checkboxes</legend>

        <label> <input type="checkbox" checked /> Helmet </label>
        <label> <input type="checkbox" checked /> Rifle </label>
        <label> <input type="checkbox" /> Vest </label>
      </fieldset>

      <fieldset>
        <legend>Select Menus</legend>

        <label>Unit</label>
        <select>
          <option>Infantry</option>
          <option selected>Artillery</option>
          <option>Engineer</option>
          <option>Medical</option>
        </select>

        <label>Select Multiple Items</label>
        <select multiple>
          <option selected>Option 1</option>
          <option>Option 2</option>
          <option selected>Option 3</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Textarea & File</legend>

        <label>Notes</label>
        <textarea rows="4">
Experienced soldier with 3 years of field operations.</textarea
        >

        <label>Upload File</label>
        <input type="file" />
      </fieldset>

      <fieldset>
        <legend>Buttons</legend>
        <input type="submit" value="Submit" class="submit-btn" />
        <input type="reset" value="Reset" class="submit-btn" />
        <button type="button" class="submit-btn">Click Me</button>
      </fieldset>
    </form>
  </body>
</html>
