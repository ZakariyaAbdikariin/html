<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimedia</title>
  </head>
  <body>
    <video controls height="600px" width="600px">
      <source src="Rabbit.mp4" type="video/mp4" />
    </video>
    <br />
    <audio controls height="600px" width="600px">
      <source src="Rabbit.mp4" type="audio/mp3" />
    </audio>
    <br />
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/VQzU9Y64kgM?si=7QKTColFZ5a40R_B"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
